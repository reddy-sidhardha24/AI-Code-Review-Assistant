<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Webpage</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      nav {
        display: flex;
        justify-content: center;
        background-color: #666;
      }

      nav a {
        padding: 10px;
        color: white;
        text-decoration: none;
      }

      .container {
        display: grid;
        grid-template-columns: 3fr 1fr;
        gap: 20px;
        padding: 20px;
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }

        nav {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Web Design</h1>
    </header>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>

    <main class="container">
      <section>
        <article>
          <h2>Main Content</h2>
          <p>This is a <mark>responsive</mark> webpage example.</p>
        </article>
      </section>

      <aside>
        <p>Sidebar content</p>
      </aside>
    </main>

    <footer>
      <p>© 2026 Web Page</p>
    </footer>
  </body>
</html>
